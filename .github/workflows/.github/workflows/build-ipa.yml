
name: Build Educraft IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extrair projeto Educraft
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz do repositorio."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          PACKAGE_FILE=$(find extracted -name package.json -print -quit)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json nao encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

      - name: Instalar dependencias e preparar iOS
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Compilar aplicativo iOS
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar IPA sem assinatura
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App.app nao encontrado."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/Educraft-unsigned.ipa" Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Educraft-unsigned-IPA
          path: Educraft-unsigned.ipa
          if-no-files-found: error
